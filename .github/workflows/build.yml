name: Build theme

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the zip to a Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches style.css version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          css_version="$(grep -iE '^\s*Version:' style.css | head -1 | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')"
          echo "Tag version:       $tag_version"
          echo "style.css version: $css_version"
          if [ "$tag_version" != "$css_version" ]; then
            echo "::error::Tag ($tag_version) does not match style.css Version ($css_version). Bump style.css before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build theme zip
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: norton-simple
          path: dist/norton-simple.zip
          if-no-files-found: error

      - name: Attach zip to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/norton-simple.zip
          generate_release_notes: true
